<title>{{OWNER}} Bookshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a spine shelf of top picks up top, then a filter rail beside the results (series, books or a book matcher). */
:root{
  --bg:#eef0f2; --panel:#f8f9fa; --card:#ffffff; --ink:#16181d; --muted:#5b616c; --line:#d6dae0;
  --rooi:#c3352b; --rooi-soft:#f6dedb; --brass:#a87b22; --brass-soft:#f3e8cf; --ok:#2f7a4a; --ok-soft:#dcefe3;
  --spine1:#7a2a24; --spine2:#1f3b5c; --spine3:#2e5a44; --spine4:#5b3a6b; --spine5:#8a5a1c; --spine6:#2b2f36;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317; --panel:#171a1f; --card:#1c1f25; --ink:#e8eaee; --muted:#9aa1ad; --line:#2d323b;
  --rooi:#f0685a; --rooi-soft:#3a1d1a; --brass:#e0b25a; --brass-soft:#352a14; --ok:#7fd19a; --ok-soft:#18301f;
  --spine1:#9b3a31; --spine2:#2f5985; --spine3:#3f7a5d; --spine4:#7a5290; --spine5:#a8742a; --spine6:#4a515d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#171a1f; --card:#1c1f25; --ink:#e8eaee; --muted:#9aa1ad; --line:#2d323b;
  --rooi:#f0685a; --rooi-soft:#3a1d1a; --brass:#e0b25a; --brass-soft:#352a14; --ok:#7fd19a; --ok-soft:#18301f;
  --spine1:#9b3a31; --spine2:#2f5985; --spine3:#3f7a5d; --spine4:#7a5290; --spine5:#a8742a; --spine6:#4a515d;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:grid;gap:26px}
h1{font:800 clamp(2rem,5vw,3rem)/1.05 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--rooi)}
.lede{margin:8px 0 0;color:var(--muted);max-width:64ch;font-size:1.05rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font:500 .85rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.facts b{color:var(--ink)}
h2{font:700 1.35rem/1.2 var(--f-display);margin:0}
.eyebrow{font:500 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rooi)}

/* spine shelf */
.shelfwrap{display:grid;gap:10px}
.shelf{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding:14px 12px 0;border-bottom:10px solid var(--ink);border-radius:4px 4px 0 0;background:linear-gradient(to bottom,transparent 60%,var(--panel));min-height:230px;scrollbar-width:thin}
.spine{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);border:0;cursor:pointer;color:#fff;padding:12px 8px;border-radius:3px 3px 1px 1px;font:700 .95rem/1.1 var(--f-display);text-align:left;display:flex;justify-content:space-between;gap:10px;box-shadow:inset -3px 0 0 rgba(0,0,0,.18),inset 3px 0 0 rgba(255,255,255,.08);transition:transform .15s}
.spine small{font:500 .66rem var(--f-mono);letter-spacing:.06em;opacity:.85}
.spine:hover,.spine:focus-visible{transform:rotate(180deg) translateY(8px)}
.spine:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font:700 1rem var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:9px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rooi)}
.tabs button:focus-visible{outline:2px solid var(--rooi);outline-offset:-2px}

.main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}

/* filters */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow:auto}
@media (max-width:820px){.filters{position:static;max-height:none}}
.filters summary{display:none}
@media (max-width:820px){.filters>details>summary{display:block;cursor:pointer;font-weight:700}}
.fgroup{display:grid;gap:6px}
.fgroup>label,.flabel{font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=search],select{width:100%;font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:500 .8rem var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:3px 9px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--rooi);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.toggle input{accent-color:var(--rooi);width:16px;height:16px}
.btn{font:700 .85rem var(--f-body);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.tagbox{max-height:170px;overflow:auto}

/* results */
.results{display:grid;gap:14px;min-width:0}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.rhead select{width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;gap:9px;min-width:0}
.card.hl{outline:3px solid var(--rooi);outline-offset:2px}
.ctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ctitle{font:700 1.25rem/1.2 var(--f-display);margin:0;text-wrap:balance}
.csub{color:var(--muted);font-size:.93rem}
.stars{color:var(--brass);letter-spacing:.08em;font-size:1.05rem;white-space:nowrap}
.stars .off{color:var(--line)}
.word{font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;text-align:right}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.b{font:500 .74rem var(--f-mono);padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.b.sub{background:var(--ink);color:var(--card);border-color:var(--ink)}
.b.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b.ongo{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.b.tag{background:var(--rooi-soft);color:var(--rooi);border-color:transparent}
.note{font-style:italic;color:var(--ink);border-left:3px solid var(--rooi);padding-left:10px;margin:0}
.syn{margin:0;max-width:72ch}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:500}
.links{display:flex;gap:14px;font-size:.88rem}
a{color:var(--rooi)}
.blist{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:.92rem}
.blist li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;align-items:baseline}
.blist .n{font:500 .78rem var(--f-mono);color:var(--muted);text-align:right}
.blist .st{font-size:.85rem}
details.more summary{cursor:pointer;color:var(--rooi);font-weight:500;font-size:.92rem}
.est{font:500 .68rem var(--f-mono);color:var(--muted)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.empty h3{font:700 1.1rem var(--f-display);color:var(--ink);margin:0 0 4px}

/* matcher */
.matcher{display:grid;gap:14px}
.mpick{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:8px}
.mpick input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.why{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.85rem;color:var(--muted)}
.score{font:500 .78rem var(--f-mono);color:var(--rooi)}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px;max-width:80ch}
@media (prefers-reduced-motion:reduce){.spine{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">{{TAGLINE}}</div>
    <h1>{{OWNER}} <span>Bookshelf</span></h1>
    <p class="lede">{{INTRO}}</p>
    <div class="facts" id="facts"></div>
  </header>

  <section class="shelfwrap" aria-labelledby="picks-h">
    <div><div class="eyebrow">Start here</div><h2 id="picks-h">Top picks: my 5-star series</h2></div>
    <div class="shelf" id="shelf" role="list"></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" data-tab="series" aria-selected="true">Series</button>
    <button type="button" role="tab" data-tab="books" aria-selected="false">Books</button>
    <button type="button" role="tab" data-tab="match" aria-selected="false">If you liked…</button>
  </nav>

  <div class="main" id="browse">
    <aside class="filters" aria-label="Filters">
      <div class="fgroup"><label for="q">Search</label><input type="search" id="q" placeholder="Title, author, series, narrator"></div>
      <div class="fgroup"><span class="flabel">My rating</span><div class="chips" id="f-rating"></div></div>
      <div class="fgroup"><label class="toggle"><input type="checkbox" id="f-finished"> Finished series only</label></div>
      <div class="fgroup"><span class="flabel">Subgenre</span><div class="chips" id="f-subgenre"></div></div>
      <div class="fgroup"><span class="flabel">Tone</span><div class="chips" id="f-tone"></div></div>
      <div class="fgroup"><span class="flabel">Pacing</span><div class="chips" id="f-pacing"></div></div>
      <div class="fgroup"><span class="flabel">Complexity</span><div class="chips" id="f-complexity"></div></div>
      <div class="fgroup"><span class="flabel">Tags (all must match)</span><div class="chips tagbox" id="f-tags"></div></div>
      <div class="fgroup"><span class="flabel">Audiobook</span>
        <label class="toggle"><input type="checkbox" id="f-audio"> Has a known audiobook</label>
        <label for="f-narrator" class="flabel" style="margin-top:4px">Narrator</label><select id="f-narrator"><option value="">Any narrator</option></select>
        <label for="f-hours" class="flabel" style="margin-top:4px">Max listening time</label>
        <select id="f-hours"><option value="">Any length</option><option value="15">Under 15 hours</option><option value="25">Under 25 hours</option><option value="40">Under 40 hours</option></select>
      </div>
      <button type="button" class="btn" id="reset">Clear filters</button>
    </aside>
    <section class="results" id="results" aria-live="polite"></section>
  </div>

  <section class="matcher" id="match" hidden>
    <div class="mpick">
      <label for="mq" class="flabel">Pick a book you loved</label>
      <input id="mq" list="mlist" placeholder="Start typing a title, e.g. The Lies of Locke Lamora" autocomplete="off">
      <datalist id="mlist"></datalist>
      <div class="csub">Books are matched on subgenre, tags, tone, pacing and complexity, and my own rating breaks ties. Books from the same series are left out.</div>
    </div>
    <div class="results" id="mresults"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  if (!DATA){ $("#results").innerHTML = '<div class="empty"><h3>No data</h3>This page was published without its book list.</div>'; return; }
  const B = DATA.books, S = DATA.series;
  const WORD = {5:"Epic",4:"Awesome",3:"Good",2:"Meh",1:"Bad"};
  const stars = r => r ? `<span class="stars" aria-label="${r} out of 5">${"★".repeat(r)}<span class="off">${"★".repeat(5-r)}</span></span>` : '<span class="csub">not rated</span>';
  const fmtN = n => !n ? "" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n);
  const uniq = a => [...new Set(a.filter(Boolean))];
  const seriesOf = Object.fromEntries(S.map(s => [s.id, s]));

  // ---- header facts ----
  const rated = B.filter(b => b.rating);
  $("#facts").innerHTML = [
    `<span><b>${B.length}</b> books finished</span>`,
    `<span><b>${S.length}</b> series</span>`,
    `<span><b>${B.filter(b => b.rating === 5).length}</b> rated 5★</span>`,
    `<span><b>${uniq(B.map(b => b.author)).length}</b> authors</span>`
  ].join("");

  // ---- top-picks shelf ----
  const spineColors = ["--spine1","--spine2","--spine3","--spine4","--spine5","--spine6"];
  const picks = S.filter(s => s.avg === 5 && s.read >= 2).sort((a, b) => b.read - a.read || a.series.localeCompare(b.series));
  $("#shelf").innerHTML = picks.map((s, i) => {
    const h = Math.min(220, 130 + s.read * 9), w = 40 + Math.min(s.read, 8) * 2;
    return `<button type="button" class="spine" role="listitem" data-series="${esc(s.id)}" style="height:${h}px;width:${w}px;background:var(${spineColors[i % spineColors.length]})" title="${esc(s.series)} by ${esc(s.author)}: ${s.read} read"><span>${esc(s.series)}</span><small>${esc(s.author.split(" ").slice(-1)[0])}</small></button>`;
  }).join("");

  // ---- filter state ----
  const F = { q:"", rating:0, finished:false, subgenre:new Set(), tone:new Set(), pacing:new Set(), complexity:new Set(), tags:new Set(), audio:false, narrator:"", hours:0 };
  let tab = "series", sortSeries = "rating", sortBooks = "rating", highlight = "";

  function chipGroup(el, values, set, labeler = v => v){
    $(el).innerHTML = values.map(v => `<button type="button" class="chip" data-v="${esc(v)}" aria-pressed="false">${esc(labeler(v))}</button>`).join("");
    $(el).addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; const v = c.dataset.v; set.has(v) ? set.delete(v) : set.add(v); c.setAttribute("aria-pressed", set.has(v)); render(); });
  }
  const count = (key) => { const m = {}; B.forEach(b => [].concat(b[key] || []).forEach(v => { if (v) m[v] = (m[v] || 0) + 1; })); return Object.keys(m).sort((a, b) => m[b] - m[a]); };
  $("#f-rating").innerHTML = [[0,"Any"],[3,"3★+"],[4,"4★+"],[5,"5★ only"]].map(([v, l]) => `<button type="button" class="chip" data-v="${v}" aria-pressed="${v === 0}">${l}</button>`).join("");
  $("#f-rating").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; F.rating = +c.dataset.v; document.querySelectorAll("#f-rating .chip").forEach(x => x.setAttribute("aria-pressed", x === c)); render(); });
  chipGroup("#f-subgenre", count("subgenre"), F.subgenre);
  chipGroup("#f-tone", ["dark","balanced","light"].filter(v => count("tone").includes(v)), F.tone);
  chipGroup("#f-pacing", ["slow","medium","fast"].filter(v => count("pacing").includes(v)), F.pacing);
  chipGroup("#f-complexity", ["light","moderate","dense"].filter(v => count("complexity").includes(v)), F.complexity);
  chipGroup("#f-tags", count("tags"), F.tags);
  const narrators = count("narrator");
  $("#f-narrator").innerHTML += narrators.map(n => `<option>${esc(n)}</option>`).join("");
  $("#q").addEventListener("input", e => { F.q = e.target.value.trim().toLowerCase(); render(); });
  $("#f-finished").addEventListener("change", e => { F.finished = e.target.checked; render(); });
  $("#f-audio").addEventListener("change", e => { F.audio = e.target.checked; render(); });
  $("#f-narrator").addEventListener("change", e => { F.narrator = e.target.value; render(); });
  $("#f-hours").addEventListener("change", e => { F.hours = +e.target.value || 0; render(); });
  $("#reset").addEventListener("click", () => {
    Object.assign(F, { q:"", rating:0, finished:false, audio:false, narrator:"", hours:0 });
    ["subgenre","tone","pacing","complexity","tags"].forEach(k => F[k].clear());
    document.querySelectorAll(".filters .chip").forEach(c => c.setAttribute("aria-pressed", c.closest("#f-rating") ? c.dataset.v === "0" : "false"));
    $("#q").value = ""; $("#f-finished").checked = false; $("#f-audio").checked = false; $("#f-narrator").value = ""; $("#f-hours").value = "";
    highlight = ""; render();
  });

  function bookPasses(b){
    if (F.q){ const hay = [b.title, b.author, b.series, ...(b.narrator || [])].join(" ").toLowerCase(); if (!hay.includes(F.q)) return false; }
    if (F.rating && !((b.rating || 0) >= F.rating)) return false;
    if (F.finished){ const s = seriesOf[b.series_id]; if (s && s.status !== "complete") return false; }
    if (F.subgenre.size && !F.subgenre.has(b.subgenre)) return false;
    if (F.tone.size && !F.tone.has(b.tone)) return false;
    if (F.pacing.size && !F.pacing.has(b.pacing)) return false;
    if (F.complexity.size && !F.complexity.has(b.complexity)) return false;
    for (const t of F.tags) if (!(b.tags || []).includes(t)) return false;
    if (F.audio && !(b.audible_url || (b.narrator || []).length)) return false;
    if (F.narrator && !(b.narrator || []).includes(F.narrator)) return false;
    if (F.hours && !(b.audio_hours && b.audio_hours < F.hours)) return false;
    return true;
  }

  function badges(b){
    const s = [];
    if (b.subgenre) s.push(`<span class="b sub">${esc(b.subgenre)}</span>`);
    ["tone","pacing","complexity"].forEach(k => b[k] && s.push(`<span class="b">${esc(k === "tone" ? b[k] : k === "pacing" ? b[k] + " pace" : b[k])}</span>`));
    (b.tags || []).forEach(t => s.push(`<span class="b tag">${esc(t)}</span>`));
    return s.length ? `<div class="badges">${s.join("")}${b.estimated ? ' <span class="est">style estimated from the series</span>' : ""}</div>` : "";
  }

  function bookCard(b, extra = ""){
    const ser = b.series ? `${esc(b.series)}${b.series_no ? " #" + esc(b.series_no) : ""} · ` : "";
    const audio = [];
    if ((b.narrator || []).length) audio.push(`Narrated by <b>${esc(b.narrator.join(", "))}</b>`);
    if (b.audio_hours) audio.push(`<b>${b.audio_hours}</b> h`);
    if (b.audible_narration) audio.push(`narration <b>${b.audible_narration}★</b>`);
    const meta = [];
    if (b.gr_rating) meta.push(`Goodreads <b>${b.gr_rating}</b>${b.gr_count ? ` (${fmtN(b.gr_count)})` : ""}`);
    if (b.pages) meta.push(`<b>${b.pages}</b> pages`);
    if (b.awards) meta.push(esc(b.awards));
    const links = [b.goodreads_url && `<a href="${esc(b.goodreads_url)}" target="_blank" rel="noopener">Goodreads ↗</a>`, b.audible_url && `<a href="${esc(b.audible_url)}" target="_blank" rel="noopener">Audible ↗</a>`].filter(Boolean);
    return `<article class="card">
      <div class="ctop"><div style="min-width:0"><h3 class="ctitle">${esc(b.title)}</h3><div class="csub">${ser}${esc(b.author)}${b.year ? " · " + b.year : ""}</div></div>
        <div>${stars(b.rating)}${b.rating ? `<span class="word">${WORD[b.rating]}</span>` : ""}</div></div>
      ${b.notes ? `<p class="note">“${esc(b.notes)}”</p>` : ""}
      ${badges(b)}
      ${audio.length ? `<div class="meta">🎧 ${audio.join(" · ")}</div>` : ""}
      ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
      ${links.length ? `<div class="links">${links.join("")}</div>` : ""}${extra}
    </article>`;
  }

  function seriesCard(s, books){
    const all = B.filter(b => b.series_id === s.id).sort((a, b) => parseFloat(a.series_no || 0) - parseFloat(b.series_no || 0));
    const first = all.find(b => b.subgenre) || all[0];
    const narr = uniq(all.flatMap(b => b.narrator || []));
    const status = s.status === "complete" ? '<span class="b done">Finished series</span>' : s.status === "ongoing" ? '<span class="b ongo">Ongoing</span>' : "";
    const progress = s.total ? `Read ${s.read} of ${s.total}` : `${s.read} read`;
    const avg = s.avg ? `<span class="stars" aria-label="average ${s.avg} out of 5">${"★".repeat(Math.round(s.avg))}<span class="off">${"★".repeat(5 - Math.round(s.avg))}</span></span><span class="word">${s.avg.toFixed(1)} avg</span>` : '<span class="csub">not rated</span>';
    return `<article class="card${highlight === s.id ? " hl" : ""}" id="s-${esc(s.id)}">
      <div class="ctop"><div style="min-width:0"><h3 class="ctitle">${esc(s.series)}</h3><div class="csub">${esc(s.author)}${s.world ? " · " + esc(s.world) : ""}</div></div><div>${avg}</div></div>
      <div class="badges">${status}<span class="b">${progress}</span>${first && first.subgenre ? `<span class="b sub">${esc(first.subgenre)}</span>` : ""}${first ? ["tone","pacing","complexity"].map(k => first[k] ? `<span class="b">${esc(k === "pacing" ? first[k] + " pace" : first[k])}</span>` : "").join("") : ""}</div>
      <p class="syn">${s.synopsis ? esc(s.synopsis) : '<span class="csub">Synopsis coming soon.</span>'}</p>
      ${narr.length ? `<div class="meta">🎧 ${esc(narr.join(", "))}</div>` : ""}
      <details class="more"${highlight === s.id ? " open" : ""}><summary>The ${all.length} book${all.length > 1 ? "s" : ""} I've read</summary>
        <ul class="blist">${all.map(b => `<li><span class="n">${esc(b.series_no || "")}</span><span>${esc(b.title)}${b.notes ? ` <i class="csub">“${esc(b.notes)}”</i>` : ""}</span><span class="st">${b.rating ? `<span class="stars">${"★".repeat(b.rating)}</span>` : ""}</span></li>`).join("")}</ul>
      </details>
    </article>`;
  }

  function render(){
    const el = $("#results"), hits = B.filter(bookPasses);
    if (tab === "series"){
      const ids = new Set(hits.map(b => b.series_id));
      let list = S.filter(s => ids.has(s.id));
      list.sort(sortSeries === "rating" ? (a, b) => (b.avg || 0) - (a.avg || 0) || b.read - a.read : sortSeries === "read" ? (a, b) => b.read - a.read : (a, b) => a.series.localeCompare(b.series));
      if (highlight){ const i = list.findIndex(s => s.id === highlight); if (i > 0) list.unshift(list.splice(i, 1)[0]); }
      el.innerHTML = `<div class="rhead"><span>${list.length} series</span><label>Sort <select id="sort">${[["rating","My rating"],["read","Most read"],["az","A–Z"]].map(([v, l]) => `<option value="${v}"${v === sortSeries ? " selected" : ""}>${l}</option>`).join("")}</select></label></div>` +
        (list.length ? list.map(s => seriesCard(s)).join("") : empty());
    } else {
      const list = hits.slice().sort(sortBooks === "rating" ? (a, b) => (b.rating || 0) - (a.rating || 0) || (b.gr_count || 0) - (a.gr_count || 0) : sortBooks === "gr" ? (a, b) => (b.gr_rating || 0) - (a.gr_rating || 0) : sortBooks === "short" ? (a, b) => (a.audio_hours || 999) - (b.audio_hours || 999) : (a, b) => a.title.localeCompare(b.title));
      el.innerHTML = `<div class="rhead"><span>${list.length} books</span><label>Sort <select id="sort">${[["rating","My rating"],["gr","Goodreads rating"],["short","Shortest listen"],["az","A–Z"]].map(([v, l]) => `<option value="${v}"${v === sortBooks ? " selected" : ""}>${l}</option>`).join("")}</select></label></div>` +
        (list.length ? list.map(b => bookCard(b)).join("") : empty());
    }
    const sel = $("#sort"); if (sel) sel.addEventListener("change", e => { if (tab === "series") sortSeries = e.target.value; else sortBooks = e.target.value; render(); });
  }
  const empty = () => '<div class="empty"><h3>Nothing matches</h3>Try removing a filter or two.</div>';

  // ---- matcher ----
  const withStyle = B.filter(b => b.subgenre);
  $("#mlist").innerHTML = B.slice().sort((a, b) => a.title.localeCompare(b.title)).map(b => `<option value="${esc(b.title)}">${esc(b.author)}</option>`).join("");
  function similar(src){
    if (!src.subgenre) return null;
    return withStyle.filter(b => b.series_id !== src.series_id || !src.series).filter(b => b.id !== src.id).map(b => {
      const why = []; let score = 0;
      if (b.subgenre === src.subgenre){ score += 3; why.push(b.subgenre); }
      const shared = (b.tags || []).filter(t => (src.tags || []).includes(t)); score += shared.length * 1.5; why.push(...shared);
      ["tone","pacing","complexity","humour"].forEach(k => { if (b[k] && b[k] === src[k]){ score += 1; why.push(k === "pacing" ? b[k] + " pace" : k === "humour" ? b[k] + " humour" : b[k]); } });
      score += (b.rating || 3) * 0.4;
      return { b, score, why };
    }).sort((x, y) => y.score - x.score);
  }
  function renderMatch(){
    const v = $("#mq").value.trim().toLowerCase(), el = $("#mresults");
    const src = B.find(b => b.title.toLowerCase() === v);
    if (!v){ el.innerHTML = '<div class="empty"><h3>Pick a book to start</h3>Choose any title from the list and you\'ll see its closest matches.</div>'; return; }
    if (!src){ el.innerHTML = '<div class="empty"><h3>Keep typing</h3>Choose a title from the suggestions.</div>'; return; }
    const res = similar(src);
    if (!res){ el.innerHTML = `<div class="empty"><h3>Not enough detail yet</h3>I haven't catalogued the style of <b>${esc(src.title)}</b> yet, so it can't be matched. Try another book.</div>`; return; }
    // one result per series keeps the list varied
    const seen = new Set(), top = [];
    for (const r of res){ const k = r.b.series_id || r.b.id; if (seen.has(k)) continue; seen.add(k); top.push(r); if (top.length === 8) break; }
    el.innerHTML = `<div class="rhead"><span>Closest to <b>${esc(src.title)}</b></span></div>` + top.map(r =>
      bookCard(r.b, `<div class="why"><span class="score">match ${Math.round(r.score * 10) / 10}</span> because: ${uniq(r.why).map(w => `<span class="b">${esc(w)}</span>`).join("")}</div>`)).join("");
  }
  $("#mq").addEventListener("input", renderMatch);

  // ---- tabs & shelf ----
  function showTab(t){
    tab = t;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    $("#browse").hidden = t === "match"; $("#match").hidden = t !== "match";
    if (t === "match") renderMatch(); else render();
    try { localStorage.setItem("rb-tab", t); } catch(_){}
  }
  document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { highlight = ""; showTab(b.dataset.tab); } });
  $("#shelf").addEventListener("click", e => {
    const sp = e.target.closest(".spine"); if (!sp) return;
    highlight = sp.dataset.series; showTab("series");
    requestAnimationFrame(() => { const c = document.getElementById("s-" + highlight); if (c) c.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); });
  });

  $("#foot").innerHTML = `Ratings are mine: 5★ Epic · 4★ Awesome · 3★ Good · 2★ Meh · 1★ Bad. Detailed style and audiobook data is filled in book by book as I catalogue my shelf (${DATA.researched} of ${DATA.total_read} books so far). Books not catalogued yet borrow their style from the rest of their series. Links go to Goodreads and Audible US.`;
  let start = "series"; try { start = localStorage.getItem("rb-tab") || "series"; } catch(_){}
  if (location.hash === "#match") start = "match"; else if (location.hash === "#books") start = "books";
  showTab(start);
})();
</script>
